    /* ================================================================
       RAISE TICKET: RaiseTicket
    ================================================================ */
    const RaiseTicket = {
      name: "RaiseTicket",
      props: { email: String, token: String, show: Boolean },
      emits: ["close", "created"],
      inject: ["toast"],
      data() {
        return {
          subject: "", description: "", priority: "Medium",
          loading: false, err: "", created: false, newName: "",
          priorities: ["Low", "Medium", "High", "Urgent"],
          subjErr: "", descErr: "",
        };
      },
      computed: {
        descLen() { return this.description.length; },
        descRemaining() { return Math.max(0, 20 - this.descLen); },
      },
      watch: {
        show(v) { if (v) this.reset(); }
      },
      methods: {
        reset() { this.subject=""; this.description=""; this.priority="Medium"; this.err=""; this.created=false; this.newName=""; this.subjErr=""; this.descErr=""; },
        validate() {
          this.subjErr = this.subject.trim().length < 5 ? "Subject must be at least 5 characters." : "";
          this.descErr = this.description.trim().length < 20 ? "Please describe your issue (min 20 chars)." : "";
          return !this.subjErr && !this.descErr;
        },
        async submit() {
          if (!this.validate()) return;
          this.loading = true; this.err = "";
          try {
            const r = await apiCall("raise_ticket", { email: this.email, token: this.token, subject: this.subject, description: this.description, priority: this.priority });
            if (r && r.success) {
              this.newName = r.ticket_name || "";
              this.created = true;
              this.toast.success("Ticket raised successfully!");
              this.$emit("created", this.newName);
            } else { this.err = (r && r.message) || "Failed to raise ticket."; }
          } catch (e) { this.err = e.message; }
          finally { this.loading = false; }
        },
      },
      template: `
        <div v-if="show" class="modal-overlay" @click.self="$emit('close')">
          <div class="modal-card">
            <div class="modal-hdr">
              <p class="modal-title"><i class="ph ph-ticket" style="margin-right:6px"></i>Raise a Support Ticket</p>
              <button class="td-close-btn" @click="$emit('close')">&times;</button>
            </div>

            <div v-if="created" class="modal-body">
              <div class="succ-banner">
                <i class="ph ph-check-circle"></i>
                <div>
                  <p style="font-weight:700;color:var(--success)">Ticket raised!</p>
                  <p style="font-size:13px;color:var(--success);margin-top:2px">Your ticket <strong>#{{ newName }}</strong> has been created. Our team will respond shortly.</p>
                </div>
              </div>
            </div>
            <div v-else class="modal-body">
              <div v-if="err" class="err-alert">{{ err }}</div>
              <div>
                <label class="fl">Subject <span style="color:var(--danger)">*</span></label>
                <input :class="['fi', subjErr && 'has-err']" v-model="subject" placeholder="Brief summary of your issue" :disabled="loading" />
                <p v-if="subjErr" class="fe">{{ subjErr }}</p>
              </div>
              <div>
                <label class="fl">Priority</label>
                <select class="fi" v-model="priority" :disabled="loading">
                  <option v-for="p in priorities" :key="p" :value="p">{{ p }}</option>
                </select>
              </div>
              <div>
                <label class="fl">Description <span style="color:var(--danger)">*</span></label>
                <textarea :class="['fi', descErr && 'has-err']" v-model="description" rows="5" placeholder="Describe your issue in detail…" :disabled="loading"></textarea>
                <p v-if="descErr" class="fe">{{ descErr }}</p>
                <p v-else class="fh">{{ descLen }} characters{{ descRemaining > 0 ? ' · ' + descRemaining + ' more needed' : '' }}</p>
              </div>
            </div>

            <div class="modal-foot">
              <button class="btn btn-outline" @click="$emit('close')">{{ created ? 'Close' : 'Cancel' }}</button>
              <button v-if="!created" class="btn btn-primary" :disabled="loading" @click="submit">
                <span v-if="loading" class="spinner"></span>
                <i v-else class="ph ph-paper-plane-tilt"></i>
                {{ loading ? 'Submitting…' : 'Submit Ticket' }}
              </button>
            </div>
          </div>
        </div>
      `,
    };

    /* ================================================================
       AUTH: AuthStepEmail, AuthStepOtp, AuthStepSetPassword,
             AuthStepLogin, SupportTrackerAuth
    ================================================================ */
    const AuthStepEmail = {
      name: "AuthStepEmail",
      props: { loading: Boolean, error: String },
      emits: ["submit"],
      data() { return { email: "" }; },
      template: `
        <div>
          <p class="auth-h">Welcome back</p>
          <p class="auth-sub">Enter your email to continue.</p>
          <form class="auth-form" @submit.prevent="$emit('submit', email)">
            <div>
              <label class="fl">Email address</label>
              <input class="fi" type="email" v-model="email" placeholder="you@company.com" autocomplete="email" required :disabled="loading" />
            </div>
            <div v-if="error" class="err-alert">{{ error }}</div>
            <button type="submit" class="auth-btn" :disabled="loading || !email.trim()">
              <span v-if="loading" class="spinner"></span>
              {{ loading ? 'Checking…' : 'Continue' }}
              <i v-if="!loading" class="ph ph-arrow-right"></i>
            </button>
          </form>
        </div>
      `,
    };

    const AuthStepOtp = {
      name: "AuthStepOtp",
      props: { email: String, loading: Boolean, error: String, resendSeconds: Number, canResend: Boolean },
      emits: ["submit", "resend", "back"],
      data() { return { otp: "" }; },
      methods: {
        onInput(e) { this.otp = e.target.value.replace(/\D/g,"").slice(0,6); },
      },
      template: `
        <div>
          <p class="auth-h">Check your email</p>
          <p class="auth-sub">We sent a 6-digit code to <strong>{{ email }}</strong></p>
          <form class="auth-form" @submit.prevent="$emit('submit', otp)">
            <input class="otp-fi" type="text" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="6" placeholder="——————" :value="otp" @input="onInput" :disabled="loading" />
            <div v-if="error" class="err-alert">{{ error }}</div>
            <button type="submit" class="auth-btn" :disabled="loading || otp.length!==6">
              <span v-if="loading" class="spinner"></span>
              {{ loading ? 'Verifying…' : 'Verify code' }}
            </button>
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px">
              <button type="button" class="auth-link" @click="$emit('back')">← Change email</button>
              <button type="button" class="auth-link" :disabled="!canResend" :style="{opacity: canResend ? 1 : 0.5}" @click="canResend && $emit('resend')">
                {{ resendSeconds > 0 ? 'Resend in ' + resendSeconds + 's' : 'Resend code' }}
              </button>
            </div>
          </form>
        </div>
      `,
    };

    const AuthStepSetPassword = {
      name: "AuthStepSetPassword",
      props: { email: String, otp: String, loading: Boolean, error: String, forgotMode: Boolean },
      emits: ["submit", "back"],
      data() { return { pw: "", confirm: "", showPw: false }; },
      computed: { match() { return !this.confirm || this.pw === this.confirm; } },
      template: `
        <div>
          <p class="auth-h">{{ forgotMode ? 'Reset password' : 'Create password' }}</p>
          <p class="auth-sub">{{ forgotMode ? 'Set a new password for your account.' : 'Create a password to secure your account.' }}</p>
          <form class="auth-form" @submit.prevent="match && pw.length>=6 && $emit('submit', pw)">
            <div>
              <label class="fl">New password</label>
              <div class="pw-wrap">
                <input class="fi" :type="showPw ? 'text' : 'password'" v-model="pw" placeholder="At least 6 characters" autocomplete="new-password" :disabled="loading" />
                <button type="button" class="pw-toggle" @click="showPw=!showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
              </div>
            </div>
            <div>
              <label class="fl">Confirm password</label>
              <input :class="['fi', confirm && !match && 'has-err']" :type="showPw ? 'text' : 'password'" v-model="confirm" placeholder="Re-enter password" autocomplete="new-password" :disabled="loading" />
              <p v-if="confirm && !match" class="fe">Passwords do not match.</p>
            </div>
            <div v-if="error" class="err-alert">{{ error }}</div>
            <button type="submit" class="auth-btn" :disabled="loading || !pw || !confirm || !match || pw.length<6">
              <span v-if="loading" class="spinner"></span>
              {{ loading ? 'Saving…' : (forgotMode ? 'Reset password' : 'Create account') }}
            </button>
            <button type="button" class="auth-link" style="text-align:center" @click="$emit('back')">← Start over</button>
          </form>
        </div>
      `,
    };

    const AuthStepLogin = {
      name: "AuthStepLogin",
      props: { email: String, loading: Boolean, error: String },
      emits: ["submit", "forgot", "back"],
      data() { return { pw: "", showPw: false }; },
      template: `
        <div>
          <p class="auth-h">Sign in</p>
          <p class="auth-sub">Welcome back, <strong>{{ email }}</strong></p>
          <form class="auth-form" @submit.prevent="$emit('submit', pw)">
            <div>
              <label class="fl">Password</label>
              <div class="pw-wrap">
                <input class="fi" :type="showPw ? 'text' : 'password'" v-model="pw" placeholder="Your password" autocomplete="current-password" required :disabled="loading" />
                <button type="button" class="pw-toggle" @click="showPw=!showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
              </div>
            </div>
            <div v-if="error" class="err-alert">{{ error }}</div>
            <button type="submit" class="auth-btn" :disabled="loading || !pw">
              <span v-if="loading" class="spinner"></span>
              {{ loading ? 'Signing in…' : 'Sign in' }}
            </button>
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px">
              <button type="button" class="auth-link" @click="$emit('back')">← Change email</button>
              <button type="button" class="auth-link" @click="$emit('forgot')">Forgot password?</button>
            </div>
          </form>
        </div>
      `,
    };

    const SupportTrackerAuth = {
      name: "SupportTrackerAuth",
      emits: ["logged-in"],
      components: { AuthStepEmail, AuthStepOtp, AuthStepSetPassword, AuthStepLogin },
      data() {
        return {
          step: "email",
          email: "", otp: "", loading: false, error: "",
          resendSeconds: 0, resendTimer: null, forgotMode: false,
        };
      },
      computed: { canResend() { return this.resendSeconds <= 0; } },
      beforeUnmount() { clearInterval(this.resendTimer); },
      methods: {
        async checkEmail(email) {
          this.loading = true; this.error = "";
          try {
            this.email = email;
            const r = await apiCall("check_email", { email });
            if (r.exists && r.verified) {
              this.step = "password";
            } else {
              await this.sendOtp();
              this.step = "otp";
            }
          } catch (e) { this.error = e.message; }
          finally { this.loading = false; }
        },
        async sendOtp() {
          await apiCall("send_otp", { email: this.email });
          this.startResendTimer();
        },
        startResendTimer() {
          this.resendSeconds = 30;
          clearInterval(this.resendTimer);
          this.resendTimer = setInterval(() => { if (--this.resendSeconds <= 0) clearInterval(this.resendTimer); }, 1000);
        },
        async verifyOtp(otp) {
          this.loading = true; this.error = "";
          try {
            this.otp = otp;
            const r = await apiCall("verify_otp", { email: this.email, otp });
            if (r.valid) { this.step = "setpw"; }
            else { this.error = r.message || "Invalid code. Please try again."; }
          } catch (e) { this.error = e.message; }
          finally { this.loading = false; }
        },
        async setPassword(pw) {
          this.loading = true; this.error = "";
          try {
            const r = await apiCall("set_password", { email: this.email, otp: this.otp, new_password: pw });
            if (r.success) { sess.save({ email: this.email, token: r.token }); this.$emit("logged-in", { email: this.email, token: r.token }); }
            else { this.error = r.message || "Could not save password."; }
          } catch (e) { this.error = e.message; }
          finally { this.loading = false; }
        },
        async login(pw) {
          this.loading = true; this.error = "";
          try {
            const r = await apiCall("portal_login", { email: this.email, password: pw });
            if (r.success) { sess.save({ email: this.email, token: r.token }); this.$emit("logged-in", { email: this.email, token: r.token }); }
            else { this.error = r.message || "Incorrect email or password."; }
          } catch (e) { this.error = e.message; }
          finally { this.loading = false; }
        },
        forgotPassword() { this.forgotMode = true; this.step = "otp"; this.sendOtp(); },
        backToEmail() { this.step = "email"; this.error = ""; this.forgotMode = false; },
      },
      template: `
        <div class="auth-page">
          <div class="auth-card">
            <div class="auth-brand">
              <div class="auth-brand-icon"><i class="ph-bold ph-shield-check"></i></div>
              <span class="auth-brand-name">${APP_NAME}</span>
            </div>
            <div class="astep-wrap" style="min-height:260px">
              <transition name="astep">
                <auth-step-email    v-if="step==='email'"    :key="'email'"    :loading="loading" :error="error" @submit="checkEmail"    />
                <auth-step-otp      v-else-if="step==='otp'"   :key="'otp'"    :email="email" :loading="loading" :error="error" :resend-seconds="resendSeconds" :can-resend="canResend" @submit="verifyOtp" @resend="sendOtp" @back="backToEmail" />
                <auth-step-set-password v-else-if="step==='setpw'" :key="'setpw'" :email="email" :otp="otp" :loading="loading" :error="error" :forgot-mode="forgotMode" @submit="setPassword" @back="backToEmail" />
                <auth-step-login    v-else-if="step==='password'" :key="'pw'"   :email="email" :loading="loading" :error="error" @submit="login" @forgot="forgotPassword" @back="backToEmail" />
              </transition>
            </div>
            <p class="auth-foot">&copy; ${new Date().getFullYear()} ${APP_NAME} &middot; Secure Support Access</p>
          </div>
        </div>
      `,
    };

    /* ================================================================
       ROOT APP
    ================================================================ */
    const RootApp = {
      name: "RootApp",
      components: { AppSidebar, DashboardView, TicketListView, TicketDetail, RaiseTicket, SupportTrackerAuth },
      data() {
        return {
          email: "", token: "", authenticated: false,
          activeView: "dashboard",
          openTicketName: null, showTicketDetail: false,
          showRaiseTicket: false,
        };
      },
      async mounted() {
        const s = sess.get();
        if (s && s.email && s.token) {
          try {
            const r = await apiCall("validate_token", { email: s.email, token: s.token });
            if (r && r.valid) { this.email = s.email; this.token = s.token; this.authenticated = true; }
            else { sess.clear(); }
          } catch { sess.clear(); }
        }
      },
      methods: {
        onLoggedIn(s) { this.email = s.email; this.token = s.token; this.authenticated = true; },
        async logout() {
          try { await apiCall("portal_logout", { email: this.email, token: this.token }); } catch { /* ignore */ }
          sess.clear();
          this.authenticated = false; this.email = ""; this.token = "";
          this.showTicketDetail = false; this.showRaiseTicket = false;
        },
        openTicket(name) { this.openTicketName = name; this.showTicketDetail = true; },
        closeTicket() { this.showTicketDetail = false; },
        onTicketCreated() { this.showRaiseTicket = false; },
        navigate(view) { this.activeView = view; },
      },
      template: `
        <div>
          <support-tracker-auth v-if="!authenticated" @logged-in="onLoggedIn" />
          <div v-else class="portal-layout">
            <app-sidebar
              :email="email"
              :active-view="activeView"
              @navigate="navigate"
              @raise-ticket="showRaiseTicket = true"
              @logout="logout"
            />
            <main class="main-col" style="overflow:hidden;position:relative">
              <transition name="view" mode="out-in">
                <dashboard-view
                  v-if="activeView==='dashboard'"
                  :key="'dashboard'"
                  :email="email"
                  @open-ticket="openTicket"
                  @raise-ticket="showRaiseTicket = true"
                  @navigate="navigate"
                />
                <ticket-list-view
                  v-else-if="activeView==='tickets'"
                  :key="'tickets'"
                  @open-ticket="openTicket"
                  @raise-ticket="showRaiseTicket = true"
                />
              </transition>
            </main>
          </div>

          <!-- Slide-over detail panel -->
          <ticket-detail
            :ticket-name="openTicketName"
            :email="email"
            :token="token"
            :show="showTicketDetail"
            @close="closeTicket"
            @refreshed="() => {}"
          />

          <!-- Raise Ticket modal -->
          <raise-ticket
            :email="email"
            :token="token"
            :show="showRaiseTicket"
            @close="showRaiseTicket = false"
            @created="onTicketCreated"
          />
        </div>
      `,
    };

    /* ================================================================
       BOOTSTRAP
    ================================================================ */
    const app = Vue.createApp(RootApp);
    app.use(ToastPlugin);
    app.mount("#app");
    {% endraw %}
  </script>
</body>
</html>
