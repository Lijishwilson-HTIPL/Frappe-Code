name: Build & Push Images

# Build-only, on purpose: this never deploys anywhere. It just builds the
# base (public apps) and custom-apps images and pushes them to GHCR, tagged
# both with the commit SHA and a branch-scoped "latest" pointer. Deploying
# whatever gets built here is a separate, manual step — see
# deploy-staging.yml / deploy-production.yml (workflow_dispatch only).

on:
  push:
    branches:
      - staging-deployment
      - production

env:
  REGISTRY: ghcr.io
  # GHCR tags must be lowercase; github.repository preserves the repo's actual
  # casing ("hephzibahtechnologies/Frappe-Code"), which fails the build.
  BASE_IMAGE_NAME: hephzibahtechnologies/frappe-code-base
  APP_IMAGE_NAME: hephzibahtechnologies/frappe-code

jobs:
  build-base:
    name: Build & push base image (erpnext/hrms/helpdesk public apps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mirrors how crm-base:public-apps was originally built on the server:
      # frappe_docker's official "layered" Containerfile, apps.json listing
      # only the public GitHub apps (erpnext/hrms/helpdesk). Cached via GHA
      # cache so this is a no-op fast job when nothing here has changed.
      - name: Build & push base image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/frappe/frappe_docker.git#main
          file: images/layered/Containerfile
          build-args: |
            FRAPPE_BRANCH=version-16
          secret-files: |
            apps_json=${{ github.workspace }}/apps-public.json
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:public-apps
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - id: out
        run: echo "image=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:public-apps" >> "$GITHUB_OUTPUT"

  build-custom:
    name: Build & push custom-apps image
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags (commit SHA + branch-scoped "latest")
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            echo "latest_tag=latest-production" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=latest-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.crm-custom
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.image }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha,scope=custom
          cache-to: type=gha,mode=max,scope=custom

      - name: Summary
        run: |
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.meta.outputs.latest_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This does NOT deploy anywhere. Run the matching deploy workflow manually (Actions tab → Deploy to Staging / Deploy to Production → Run workflow) when ready." >> "$GITHUB_STEP_SUMMARY"
