name: Deploy to Staging

on:
  push:
    branches:
      - stagging-deployment

jobs:
  deploy:
    name: Build & Deploy Docker to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /home/hephzibahtech2/frappe-crm

            echo "=== Rebuilding image from latest stagging-deployment ==="
            docker compose build --no-cache frappe

            echo "=== Restarting containers ==="
            docker compose down
            docker compose up -d

            echo "=== Waiting for frappe to be healthy (up to 5 min) ==="
            for i in $(seq 1 30); do
              if docker compose exec -T frappe curl -sf http://localhost:8000/api/method/ping > /dev/null 2>&1; then
                echo "Site is up!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 10
            done

            echo "=== Creating site if it does not exist ==="
            if ! docker compose exec -T frappe bench --site mysite.local list-apps > /dev/null 2>&1; then
              echo "Site not found — creating..."
              docker compose exec -T frappe bench new-site mysite.local \
                --db-root-password "${MYSQL_ROOT_PASSWORD:-root}" \
                --admin-password "Admin@12345" \
                --no-mariadb-socket
              docker compose exec -T frappe bench --site mysite.local install-app erpnext
              docker compose exec -T frappe bench --site mysite.local install-app crm
              docker compose exec -T frappe bench --site mysite.local install-app hrms
              docker compose exec -T frappe bench --site mysite.local install-app helpdesk
              docker compose exec -T frappe bench --site mysite.local install-app telephony
              docker compose exec -T frappe bench --site mysite.local install-app sbiqc_provisioning
            fi

            echo "=== Running migrations ==="
            docker compose exec -T frappe bench --site mysite.local migrate

            echo "=== Clearing cache ==="
            docker compose exec -T frappe bench --site mysite.local clear-cache
            docker compose exec -T frappe bench --site mysite.local clear-website-cache

            echo "=== Deployment complete ==="
