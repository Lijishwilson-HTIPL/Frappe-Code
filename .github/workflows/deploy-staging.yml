name: Deploy to Staging

on:
  push:
    branches:
      - staging-deployment   # fixed typo (was "stagging-deployment" — never matched the real branch)

env:
  REGISTRY: ghcr.io
  # GHCR tags must be lowercase; github.repository preserves the repo's actual
  # casing ("hephzibahtechnologies/Frappe-Code"), which fails the build.
  BASE_IMAGE_NAME: hephzibahtechnologies/frappe-code-base
  APP_IMAGE_NAME: hephzibahtechnologies/frappe-code

jobs:
  build-base:
    name: Build & push base image (erpnext/hrms/helpdesk public apps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mirrors how crm-base:public-apps was originally built on the server:
      # frappe_docker's official "layered" Containerfile, apps.json listing
      # only the public GitHub apps (erpnext/hrms/helpdesk). Cached via GHA
      # cache so this is a no-op fast job when nothing here has changed.
      - name: Build & push base image
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/frappe/frappe_docker.git#main
          file: images/layered/Containerfile
          build-args: |
            FRAPPE_BRANCH=version-16
          secret-files: |
            apps_json=${{ github.workspace }}/apps-public.json
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:public-apps
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - id: out
        run: echo "image=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:public-apps" >> "$GITHUB_OUTPUT"

  build-custom:
    name: Build & push custom-apps image
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag (unique per build — commit SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile.crm-custom
          build-args: |
            BASE_IMAGE=${{ needs.build-base.outputs.image }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=custom
          cache-to: type=gha,mode=max,scope=custom

  deploy:
    name: Deploy to crm-docker-build (72.167.140.185)
    needs: build-custom
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}          # 72.167.140.185
          username: ${{ secrets.STAGING_USER }}       # htipladmin
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            IMAGE_TAG="${{ needs.build-custom.outputs.image_tag }}"
            IMAGE="ghcr.io/hephzibahtechnologies/frappe-code:${IMAGE_TAG}"
            cd /home/htipladmin/crm-docker-build

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | sudo docker login ghcr.io -u "${{ secrets.STAGING_USER }}" --password-stdin

            echo "=== Pulling ${IMAGE} ==="
            sudo docker pull "${IMAGE}"
            sudo docker tag "${IMAGE}" crm-deploy:${IMAGE_TAG}

            echo "=== Updating .env — same folder, same volumes, no data touched ==="
            sed -i "s/^CUSTOM_TAG=.*/CUSTOM_TAG=${IMAGE_TAG}/" .env

            echo "=== Recreating all app-tier services from the new tag ==="
            sudo docker compose up -d

            echo "=== Waiting for backend to become healthy before migrating ==="
            for i in $(seq 1 30); do
              if sudo docker exec crm-backend-1 curl -sf -H "Host: mysite.local" http://localhost:8000/api/method/ping >/dev/null 2>&1; then
                echo "Backend is up."
                break
              fi
              echo "Backend not ready yet, waiting... ($i/30)"
              sleep 5
              if [ "$i" -eq 30 ]; then
                echo "Backend never became healthy — aborting before migrate."
                exit 1
              fi
            done

            echo "=== Running bench migrate (schema/patches — do NOT skip, do NOT run manually on the server) ==="
            sudo docker exec crm-backend-1 bench --site all migrate

            echo "=== Force-reimporting DMS Workspace/Number Card/Dashboard Chart/Sidebar fixtures ==="
            echo "=== (bench migrate does NOT overwrite these once they exist in the DB — see quality_dms dashboard incident 2026-07-28) ==="
            for f in \
              apps/quality_dms/quality_dms/dms/workspace/dms/dms.json \
              apps/quality_dms/quality_dms/dms/number_card/pending_revision_requests/pending_revision_requests.json \
              apps/quality_dms/quality_dms/dms/number_card/total_revisions/total_revisions.json \
              apps/quality_dms/quality_dms/dms/number_card/total_documents/total_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/draft_documents/draft_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/published_documents/published_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/documents_in_review/documents_in_review.json \
              apps/quality_dms/quality_dms/dms/number_card/obsolete_documents/obsolete_documents.json \
              apps/quality_dms/quality_dms/dms/number_card/approved_documents/approved_documents.json \
              apps/quality_dms/quality_dms/dms/dashboard_chart/training_compliance_by_department/training_compliance_by_department.json \
              apps/quality_dms/quality_dms/dms/dashboard_chart/documents_by_status/documents_by_status.json \
              apps/quality_dms/quality_dms/workspace_sidebar/dms.json \
            ; do
              full="/home/frappe/frappe-bench/${f}"
              echo "--- reimporting ${full} ---"
              sudo docker exec crm-backend-1 bench --site mysite.local execute frappe.modules.import_file.import_file_by_path \
                --kwargs "{\"path\": \"${full}\", \"force\": True, \"ignore_version\": True}" || echo "WARNING: reimport failed for ${full}, continuing"
            done

            echo "=== Clearing Frappe cache (avoid stale asset-hash HTML) ==="
            sudo docker exec crm-backend-1 bench --site all clear-cache || true
            sudo docker exec crm-backend-1 bench --site all clear-website-cache || true

            echo "=== Pruning old crm-deploy tags (keep current) ==="
            sudo docker images crm-deploy --format '{{.Tag}}' \
              | grep -v "^${IMAGE_TAG}\$" \
              | xargs -r -I{} sudo docker rmi crm-deploy:{} || true

            echo "=== Deployment complete: ${IMAGE} ==="
